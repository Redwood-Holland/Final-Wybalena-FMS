<!DOCTYPE html>
<html>
    <head><meta name = "viewport" content= "width=device-width, initial-scale=1"><title>Wybalena FMS</title></head>

    <body>
        <h1> Wybalena FMS</h1>
        <input id = "name" placeholder="paddock name">
        <button onclick="add()">Add</button>
        <ul id="list">
        </ul>
        <script>
            async function load() {
                const rows = await (await
                    fetch('/api/paddocks')).json();
                    document.getElementById('list').innerHTML = rows.map(r=> `<li>${r.paddock_name}</li>`).join('');
            }

            async function add(){
                await fetch('\api\paddocks', {method: 'POST', headers:{'Content-Type': 'application/json' },
                body: JSON.stringify({name: document.getElementById('name').value })});
                document.getElementById('name').value = '';
                load();

            }
            load();
        </script>
    </body>
</html>
